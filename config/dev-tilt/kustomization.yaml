apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudflare-tunnel-operator-system
resources:
- ../dev
patches: []
configMapGenerator:
- name: cloudflare-tunnel-operator-config-dev
  behavior: replace
  envs:
  - .env # actual config file (not commit)
secretGenerator:
- name: cloudflare-tunnel-operator-secret-dev
  behavior: replace
  envs:
  - .env.secret # actual secret file (not commit)
